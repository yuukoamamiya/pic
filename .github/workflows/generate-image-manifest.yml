name: Generate image manifest

on:
  push:
    branches:
      - master
    paths-ignore:
      - image-manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image reader
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate manifest
        run: python scripts/generate-image-manifest.py

      - name: Commit manifest when it changed
        shell: bash
        run: |
          if git diff --quiet -- image-manifest.json && git ls-files --error-unmatch image-manifest.json >/dev/null 2>&1; then
            echo "Image manifest is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-manifest.json
          git commit -m "Update image manifest"
          git push
